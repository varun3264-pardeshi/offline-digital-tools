<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Saver</title>
  <style>
    :root {
      --bg: #FAF7F2;
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #C2410C;
      --text: #18181B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { width: 300px; background: var(--bg); color: var(--text); padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .title { font-size: 1.1rem; font-weight: 800; color: #C2410C; border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem; }
    .stats-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: #94a3b8; }
    .btn { padding: 0.6rem; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
    .btn-md { background: rgba(255, 255, 255, 0.08); color: #18181B; border: 1px solid var(--card-border); }
    .btn-pdf { background: linear-gradient(135deg, #C2410C, #0088ff); color: #FAF7F2; }
  </style>
</head>
<body>
  <div class="title">💬 Save This Chat</div>
  <div class="stats-row">
    <span>Messages Detected:</span>
    <strong style="color: #18181B;" id="p-msg-count">24</strong>
  </div>
  <div class="stats-row">
    <span>Code Blocks:</span>
    <strong style="color: #00f5a0;" id="p-code-count">3</strong>
  </div>

  <button class="btn btn-pdf" onclick="saveAsPdf()">📄 Save as PDF</button>
  <button class="btn btn-md" onclick="saveAsMarkdown()">📝 Save as Markdown (.md)</button>
  <button class="btn btn-md" style="font-size: 0.75rem;" onclick="window.open('index.html')">Open Full Chat Saver Studio →</button>

  <script>
    function saveAsPdf() { window.print(); }
    function saveAsMarkdown() { alert('Chat exported to Markdown file!'); }
  </script>
</body>
</html>
