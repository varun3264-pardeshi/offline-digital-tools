<!DOCTYPE html>
<html lang="en" data-palette="mulberry">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; img-src 'self' data: blob:; connect-src 'self' data: blob:;" />
  <title>Practice Viva Questions from Your Study Notes (Tool 16)</title>
  <link rel="stylesheet" href="../assets/studio-ui.css" />
  <script src="../assets/security-auth.js" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-canvas);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .brand {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--text-main);
    }

    .btn {
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-elevated);
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn.active, .btn-primary {
      background: var(--accent-primary);
      color: #FFFFFF;
      border-color: var(--accent-primary);
    }

    main {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 2.5rem;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 1.35rem;
      align-items: start;
    }

    /* Interactive Terminal / Examiner Window */
    .terminal-window {
      background: #1E1B24;
      color: #F3E8FF;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 540px;
      box-shadow: var(--shadow-md);
    }

    .terminal-bar {
      background: #2A2433;
      padding: 0.65rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 0.8rem;
      font-family: monospace;
    }

    .dots { display: flex; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-r { background: #F87171; }
    .dot-y { background: #FBBF24; }
    .dot-g { background: #34D399; }

    .terminal-body {
      flex: 1;
      padding: 1.15rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .t-user { color: #FCD34D; font-weight: 700; }
    .t-examiner { color: #F3E8FF; }
    .t-question { color: #6EE7B7; font-weight: 700; background: rgba(16, 185, 129, 0.12); padding: 0.55rem 0.75rem; border-radius: 8px; border-left: 3px solid #10B981; }
    .t-score { color: #FDE68A; font-weight: 800; background: rgba(245, 158, 11, 0.15); padding: 0.65rem 0.85rem; border-radius: 8px; border: 1px solid #F59E0B; }

    .terminal-input-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: #2A2433;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .term-input {
      flex: 1;
      background: #1E1B24 !important;
      color: #FFFFFF !important;
      border: 1px solid #4C3D63 !important;
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.88rem;
      outline: none;
    }

    .spec-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: var(--shadow-sm);
    }

    .input-selector-btn {
      width: 100%;
      text-align: left;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-canvas);
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.84rem;
      transition: all 0.15s ease;
    }

    .input-selector-btn:hover, .input-selector-btn.active {
      border-color: var(--accent-primary);
      background: var(--accent-primary-soft);
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="brand">Practice Viva Questions from Your Study Notes</div>
    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
      <button class="btn active" id="mode-skill-btn" onclick="setMode(true)">🎓 With /viva Skill (1-by-1 Graded)</button>
      <button class="btn" id="mode-raw-btn" onclick="setMode(false)">💬 Without Skill (Compare)</button>
      <a href="SKILL.md" class="btn" target="_blank">📄 View SKILL.md</a>
      <button class="btn btn-primary" onclick="restartViva()">🔄 New Session</button>
    </div>
  </nav>

  <main>
    <!-- Left Interactive Viva Session -->
    <div class="terminal-window">
      <div class="terminal-bar">
        <div class="dots"><span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span></div>
        <span id="session-title-bar">/viva session · 1 question at a time</span>
      </div>

      <div class="terminal-body" id="term-log"></div>

      <div class="terminal-input-row">
        <span style="color: #6EE7B7; font-family: monospace; font-weight: bold;">&gt;</span>
        <input type="text" id="user-input" class="term-input" placeholder="Type your answer and press Enter..." onkeydown="if(event.key==='Enter') submitInput()">
        <button class="btn btn-primary" onclick="submitInput()">Submit ↵</button>
      </div>
    </div>

    <!-- Right Input Selector & Custom Notes -->
    <div class="spec-panel">
      <div>
        <h2 style="font-size: 1.15rem; font-weight: 800;">1. Choose Study Notes (3 Sample Topics)</h2>
        <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.15rem;">Select any note pack below to start a fresh 5-question viva:</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 0.5rem;">
        <button class="input-selector-btn active" id="btn-sub-thermo" onclick="startSubject('thermo')">
          <strong>Input 1: Thermodynamics & Heat Engines</strong><br>
          <code style="font-size:0.75rem; color:var(--accent-primary);">/viva sample-thermo-notes.txt</code>
        </button>
        <button class="input-selector-btn" id="btn-sub-ds" onclick="startSubject('ds')">
          <strong>Input 2: Data Structures & Balanced Trees</strong><br>
          <code style="font-size:0.75rem; color:var(--accent-primary);">/viva sample-ds-notes.txt</code>
        </button>
        <button class="input-selector-btn" id="btn-sub-ml" onclick="startSubject('ml')">
          <strong>Input 3: Machine Learning & Transformers</strong><br>
          <code style="font-size:0.75rem; color:var(--accent-primary);">/viva sample-ml-notes.txt</code>
        </button>
      </div>

      <div style="border-top: 1px solid var(--border-color); padding-top: 0.85rem;">
        <h3 style="font-size: 0.95rem; font-weight: 800; margin-bottom: 0.4rem;">2. Or Paste Your Own Study Notes</h3>
        <textarea id="custom-notes-box" rows="4" style="width:100%; padding:0.55rem; border-radius:8px; font-size:0.82rem;" placeholder="Paste any paragraph from your notes here and click Start Custom Viva..."></textarea>
        <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem;" onclick="startCustomNotesViva()">
          ▶ Start Viva from Custom Notes
        </button>
      </div>
    </div>
  </main>

  <script>
    const examBanks = {
      thermo: {
        file: "sample-thermo-notes.txt",
        questions: [
          { q: "Q1. State the First Law of Thermodynamics and its energy conservation equation.", good: ["delta u", "energy", "conservation", "heat", "work"], feedback: "Good. Internal energy change ΔU = Q - W.", weakPage: 8 },
          { q: "Q2. Why can no engine beat Carnot efficiency?", good: ["second law", "entropy", "reversible", "temperature", "friction"], feedback: "Partly. Friction lowers real engines, but even an ideal reversible engine is bounded by reservoir temperatures (1 - Tc/Th).", weakPage: 14 },
          { q: "Q3. In an isothermal expansion of an ideal gas, what is the change in internal energy ΔU?", good: ["zero", "0", "constant"], feedback: "Correct! Since temperature T is constant, ΔU = 0.", weakPage: 18 },
          { q: "Q4. Does the entropy of an isolated system ever decrease in a spontaneous process?", good: ["no", "never", "increases"], feedback: "Spot on. By the Second Law, ΔS_isolated >= 0.", weakPage: 18 },
          { q: "Q5. Which temperature scale must always be used in the Carnot efficiency formula?", good: ["kelvin", "absolute"], feedback: "Correct — always use absolute Kelvin (K).", weakPage: 14 }
        ]
      },
      ds: {
        file: "sample-ds-notes.txt",
        questions: [
          { q: "Q1. What is the worst-case search time complexity of an unbalanced Binary Search Tree?", good: ["o(n)", "linear"], feedback: "Correct. A skewed BST degrades to a linked list with O(N) lookup.", weakPage: 11 },
          { q: "Q2. How does an AVL tree maintain O(log N) height after insertions?", good: ["rotation", "balance", "factor"], feedback: "Right — single and double rotations restore balance factor in [-1, 1].", weakPage: 16 },
          { q: "Q3. What is the difference between Chaining and Open Addressing in hash tables?", good: ["linked", "probe", "probing", "bucket"], feedback: "Good distinction between bucket lists and linear/quadratic probing.", weakPage: 21 },
          { q: "Q4. Which traversal finds the shortest path in an unweighted graph?", good: ["bfs", "breadth"], feedback: "Correct! Breadth-First Search explores level by level.", weakPage: 24 },
          { q: "Q5. Why do arrays iterate faster than linked lists on modern CPUs?", good: ["cache", "contiguous", "locality"], feedback: "Exactly — contiguous memory leverages CPU cache lines.", weakPage: 5 }
        ]
      },
      ml: {
        file: "sample-ml-notes.txt",
        questions: [
          { q: "Q1. What causes the dying ReLU problem during neural network training?", good: ["negative", "zero", "gradient"], feedback: "Correct — negative inputs output 0 with a 0 gradient.", weakPage: 19 },
          { q: "Q2. Why does scaled dot-product attention divide by sqrt(d_k)?", good: ["variance", "softmax", "gradient", "scale"], feedback: "Right — prevents large dot products from pushing softmax into flat gradients.", weakPage: 25 },
          { q: "Q3. Which regularization penalty (L1 or L2) produces sparse zero weights?", good: ["l1", "lasso"], feedback: "Correct — L1 (Lasso) drives irrelevant weights to exact zero.", weakPage: 6 },
          { q: "Q4. Why is accuracy misleading on a 99% negative imbalanced dataset?", good: ["precision", "recall", "f1", "imbalance"], feedback: "Spot on — predicting all negatives gives 99% accuracy with 0% recall.", weakPage: 29 },
          { q: "Q5. What two moments of gradients does the Adam optimizer track?", good: ["first", "second", "mean", "variance", "momentum"], feedback: "Correct — exponential moving averages of gradient mean and uncentered variance.", weakPage: 12 }
        ]
      }
    };

    let activeBankKey = 'thermo';
    let useSkillMode = true;
    let currentStep = 0;
    let score = 0;
    let weakestPage = 14;

    function print(msg, cls = 't-examiner') {
      const log = document.getElementById('term-log');
      const div = document.createElement('div');
      div.className = cls;
      div.innerHTML = msg;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function setMode(withSkill) {
      useSkillMode = withSkill;
      document.getElementById('mode-skill-btn').classList.toggle('active', withSkill);
      document.getElementById('mode-raw-btn').classList.toggle('active', !withSkill);
      document.getElementById('session-title-bar').textContent = withSkill
        ? '/viva skill active · 1 question at a time'
        : 'Raw chat (without skill) · dumps all questions at once';
      restartViva();
    }

    function startSubject(key) {
      activeBankKey = key;
      ['thermo', 'ds', 'ml'].forEach(k => {
        const b = document.getElementById('btn-sub-' + k);
        if (b) b.classList.toggle('active', k === key);
      });
      restartViva();
    }

    function startCustomNotesViva() {
      const raw = document.getElementById('custom-notes-box').value.trim();
      if (!raw) return;
      const sentences = raw.split(/[.?!\n]+/).map(s => s.trim()).filter(Boolean);
      const topic = sentences[0] ? sentences[0].slice(0, 45) : 'Custom Notes';
      examBanks.custom = {
        file: "custom-notes.txt",
        questions: [
          { q: `Q1. Based on your notes ("${topic}..."), state the core definition in your own words.`, good: ["is", "the", "by", "means"], feedback: "Good explanation of the primary concept.", weakPage: 1 },
          { q: "Q2. What is the key formula, rule, or mechanism mentioned in these notes?", good: ["=", "law", "rule", "rate", "process"], feedback: "Solid grasp of the mechanism.", weakPage: 2 },
          { q: "Q3. Give a practical real-world application or edge case where this concept fails.", good: ["real", "when", "limit", "case", "example"], feedback: "Good critical thinking on boundary conditions.", weakPage: 3 },
          { q: "Q4. How does the first concept in your notes connect to the conclusion?", good: ["because", "leads", "therefore", "connect"], feedback: "Clear logical link.", weakPage: 4 },
          { q: "Q5. Summarize the takeaway of your notes in one concise sentence.", good: ["in", "to", "for", "with"], feedback: "Concise summary.", weakPage: 1 }
        ]
      };
      activeBankKey = 'custom';
      restartViva();
    }

    function restartViva() {
      const log = document.getElementById('term-log');
      log.innerHTML = '';
      currentStep = 0;
      score = 0;
      const bank = examBanks[activeBankKey];

      if (!useSkillMode) {
        print(`&gt; Ask me viva questions on ${bank.file}`, 't-user');
        print(`Sure! Here are 5 questions all at once (Without /viva skill — no step-by-step pacing or rubric):<br>` +
          bank.questions.map(q => `• ${q.q}`).join('<br>'), 't-examiner');
        return;
      }

      print(`&gt; /viva ${bank.file}`, 't-user');
      print(`Reading notes (${bank.file}). Asking 5 questions, one at a time.`, 't-examiner');
      print(bank.questions[0].q, 't-question');
    }

    function submitInput() {
      const input = document.getElementById('user-input');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';

      print(`&gt; ${val}`, 't-user');

      if (!useSkillMode) {
        print(`Great job! Keep studying your notes! (Generic response without /viva skill rubric)`, 't-examiner');
        return;
      }

      const bank = examBanks[activeBankKey];
      if (currentStep >= bank.questions.length) {
        restartViva();
        return;
      }

      const curQ = bank.questions[currentStep];
      const lower = val.toLowerCase();
      const matched = curQ.good.some(kw => lower.includes(kw)) || val.length > 18;
      if (matched) {
        score += 1;
      } else {
        weakestPage = curQ.weakPage;
      }

      print(`Examiner: ${curQ.feedback}`, 't-examiner');
      currentStep++;

      if (currentStep < bank.questions.length) {
        print(bank.questions[currentStep].q, 't-question');
      } else {
        print(`Score: ${score}/5. Revise page ${weakestPage}.`, 't-score');
      }
    }

    restartViva();
  </script>
</body>
</html>
