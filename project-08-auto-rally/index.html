<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Auto Rally · 3-Lap Auto-Rickshaw Racing Game</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #070913;
      --card-bg: rgba(22, 27, 46, 0.8);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #f6d365;
      --accent-cyan: #00f2fe;
      --accent-rose: #ff5858;
      --accent-emerald: #00f5a0;
      --text: #f0f4fc;
      --text-muted: #8e9bb5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: manipulation;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Ambient Liquid Mesh Glow */
    .ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.25;
      animation: float 22s infinite alternate ease-in-out;
    }

    .b1 { width: 500px; height: 500px; background: radial-gradient(circle, #f6d365, #fda085); top: -15%; left: 10%; }
    .b2 { width: 450px; height: 450px; background: radial-gradient(circle, #00f2fe, #4facfe); bottom: -15%; right: 10%; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    /* Header Nav */
    nav {
      position: relative;
      z-index: 10;
      background: rgba(13, 16, 28, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f6d365, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.9rem;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-active {
      background: rgba(0, 245, 160, 0.15);
      border-color: var(--accent-emerald);
      color: var(--accent-emerald);
    }

    /* Game Stage Area */
    .game-wrapper {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
    }

    .game-canvas-box {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: calc(100vh - 170px);
      max-height: 680px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.12);
      background: #000;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* In-Game Heads-Up Display (HUD) */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .hud-badge {
      background: rgba(13, 16, 28, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Mobile On-Screen Touch Controls */
    .touch-controls {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .touch-cluster {
      display: flex;
      gap: 0.75rem;
      pointer-events: auto;
    }

    .touch-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease, background 0.1s ease;
    }

    .touch-btn:active {
      transform: scale(0.92);
      background: rgba(246, 211, 101, 0.3);
      border-color: var(--accent);
    }

    /* Modal Victory / Start Screen */
    .game-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      z-index: 20;
    }

    .modal-title {
      font-size: 2.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #f6d365, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="ambient-glow">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
  </div>

  <nav>
    <div class="brand">
      <a href="../index.html" class="btn" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;">← Hub</a>
      <span>🛺 Auto Rally</span>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <button class="btn btn-active" id="audio-toggle-btn" onclick="toggleMute()">🔊 Sound: ON</button>
      <button class="btn" onclick="resetBestTime()">🔄 Reset Record</button>
    </div>
  </nav>

  <div class="game-wrapper">
    <div class="game-canvas-box">
      <canvas id="game-canvas" width="400" height="600"></canvas>

      <!-- Heads-Up Display -->
      <div class="hud-overlay">
        <div style="display: flex; flex-direction: column; gap: 0.4rem;">
          <div class="hud-badge" style="color: #f6d365;">🪙 <span id="hud-coins">0</span></div>
          <div class="hud-badge" style="color: #00f2fe;">🏆 Best: <span id="hud-best-time">--:--</span></div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem;">
          <div class="hud-badge" style="color: #fff;">🚩 <span id="hud-laps">Lap 1/3</span></div>
          <div class="hud-badge" style="color: #00f5a0; font-family: monospace;" id="hud-timer">00:00.0</div>
        </div>
      </div>

      <!-- Touch Controls for Mobile -->
      <div class="touch-controls">
        <div class="touch-cluster">
          <div class="touch-btn" id="t-left">◀</div>
          <div class="touch-btn" id="t-right">▶</div>
        </div>
        <div class="touch-cluster">
          <div class="touch-btn" style="background: rgba(255, 88, 88, 0.25);" id="t-brake">🛑</div>
          <div class="touch-btn" style="background: rgba(0, 245, 160, 0.25);" id="t-gas">⚡</div>
        </div>
      </div>

      <!-- Start / Victory Screen Overlay -->
      <div class="game-modal" id="game-modal">
        <div class="modal-title" id="modal-heading">AUTO RALLY</div>
        <p style="color: #cbd5e1; font-size: 0.95rem; margin-bottom: 1.5rem;" id="modal-subheading">
          Pass the phone to friends and race 3 laps without crashing! Use ◀ ▶ keys or touch buttons.
        </p>
        <button class="btn" style="padding: 0.8rem 2rem; font-size: 1.1rem; background: linear-gradient(135deg, #f6d365, #00f2fe); color: #070913; font-weight: 800; border: none;" onclick="startGame()">
          ▶ START RACE (3 LAPS)
        </button>
      </div>
    </div>
  </div>

  <script>
    // Web Audio API Procedural Synthesizer (Zero MP3s needed - 100% Offline)
    let audioCtx = null;
    let isMuted = false;
    let engineOsc = null;
    let engineGain = null;

    function initAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      // Engine oscillator
      engineOsc = audioCtx.createOscillator();
      engineGain = audioCtx.createGain();
      engineOsc.type = 'sawtooth';
      engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
      engineGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      engineOsc.connect(engineGain);
      engineGain.connect(audioCtx.destination);
      engineOsc.start();
    }

    function playSound(type) {
      if (isMuted || !audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now); // B5
        osc.frequency.exponentialRampToValueAtTime(1318.51, now + 0.1); // E6
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'boost') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'crash') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.25);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById('audio-toggle-btn');
      if (isMuted) {
        btn.innerText = '🔇 Sound: OFF';
        btn.classList.remove('btn-active');
        if (engineGain) engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
      } else {
        btn.innerText = '🔊 Sound: ON';
        btn.classList.add('btn-active');
        if (engineGain) engineGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      }
    }

    // Game Canvas & Physics Engine
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    let gameState = 'ready'; // ready, playing, finished
    let autoX = 200;
    let autoSpeed = 0;
    let maxSpeed = 12;
    let boostTime = 0;
    let coinsCount = 0;
    let currentLap = 1;
    let lapDistance = 0;
    const LAP_LENGTH = 1500;
    let raceStartTime = 0;
    let raceElapsedTime = 0;
    let bestTime = localStorage.getItem('auto_rally_best_time') || null;

    // Road & Scenery
    let roadCurve = 0;
    let entities = []; // coins, obstacles, powerups

    // Controls State
    const keys = { left: false, right: false, up: false, down: false };

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
    });

    // Touch Button Handlers
    function bindTouch(id, keyName) {
      const el = document.getElementById(id);
      const start = (e) => { e.preventDefault(); keys[keyName] = true; };
      const end = (e) => { e.preventDefault(); keys[keyName] = false; };
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', end, { passive: false });
    }
    bindTouch('t-left', 'left');
    bindTouch('t-right', 'right');
    bindTouch('t-gas', 'up');
    bindTouch('t-brake', 'down');

    function updateBestDisplay() {
      document.getElementById('hud-best-time').innerText = bestTime ? formatTime(bestTime) : '--:--';
    }
    updateBestDisplay();

    function formatTime(ms) {
      const mins = Math.floor(ms / 60000);
      const secs = Math.floor((ms % 60000) / 1000);
      const dec = Math.floor((ms % 1000) / 100);
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}.${dec}`;
    }

    function startGame() {
      initAudio();
      document.getElementById('game-modal').style.display = 'none';
      gameState = 'playing';
      autoX = canvas.width / 2;
      autoSpeed = 3;
      coinsCount = 0;
      currentLap = 1;
      lapDistance = 0;
      raceStartTime = Date.now();
      entities = [];
      spawnEntities();
    }

    function spawnEntities() {
      entities = [];
      for (let i = 200; i < LAP_LENGTH * 3; i += 180) {
        const typeRand = Math.random();
        const laneX = canvas.width / 2 + (Math.random() - 0.5) * 160;
        if (typeRand < 0.55) {
          entities.push({ type: 'coin', y: i, x: laneX });
        } else if (typeRand < 0.82) {
          entities.push({ type: 'obstacle', y: i, x: laneX });
        } else {
          entities.push({ type: 'boost', y: i, x: laneX });
        }
      }
    }

    // 60FPS Game Loop
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function update() {
      if (gameState !== 'playing') return;

      // Acceleration & Braking
      if (boostTime > 0) {
        boostTime--;
        maxSpeed = 19;
        autoSpeed = Math.min(maxSpeed, autoSpeed + 0.4);
      } else {
        maxSpeed = 12;
        if (keys.up) {
          autoSpeed = Math.min(maxSpeed, autoSpeed + 0.2);
        } else if (keys.down) {
          autoSpeed = Math.max(1, autoSpeed - 0.3);
        } else {
          autoSpeed = Math.max(3, autoSpeed - 0.05); // cruising
        }
      }

      // Steering
      if (keys.left) autoX -= 5;
      if (keys.right) autoX += 5;

      // Road boundaries
      autoX = Math.max(80, Math.min(canvas.width - 80, autoX));

      // Lap Progression
      lapDistance += autoSpeed;
      if (lapDistance >= LAP_LENGTH) {
        lapDistance = 0;
        currentLap++;
        if (currentLap > 3) {
          finishRace();
          return;
        }
      }

      // Engine Sound Pitch update
      if (engineOsc && !isMuted) {
        engineOsc.frequency.setValueAtTime(45 + (autoSpeed * 10), audioCtx.currentTime);
      }

      // Entity Collision & Movement
      const playerDist = (currentLap - 1) * LAP_LENGTH + lapDistance;
      for (let i = 0; i < entities.length; i++) {
        const e = entities[i];
        const screenY = canvas.height - 130 - (e.y - playerDist);

        if (screenY > canvas.height - 180 && screenY < canvas.height - 80) {
          if (Math.abs(e.x - autoX) < 32) {
            // Collision!
            if (e.type === 'coin') {
              coinsCount++;
              playSound('coin');
              entities.splice(i, 1);
              i--;
            } else if (e.type === 'boost') {
              boostTime = 90;
              playSound('boost');
              entities.splice(i, 1);
              i--;
            } else if (e.type === 'obstacle') {
              autoSpeed = 2; // slow down
              playSound('crash');
              entities.splice(i, 1);
              i--;
            }
          }
        }
      }

      // HUD Updates
      raceElapsedTime = Date.now() - raceStartTime;
      document.getElementById('hud-timer').innerText = formatTime(raceElapsedTime);
      document.getElementById('hud-laps').innerText = `Lap ${currentLap}/3`;
      document.getElementById('hud-coins').innerText = coinsCount;
    }

    function finishRace() {
      gameState = 'finished';
      const isNewBest = !bestTime || raceElapsedTime < bestTime;
      if (isNewBest) {
        bestTime = raceElapsedTime;
        localStorage.setItem('auto_rally_best_time', bestTime);
        updateBestDisplay();
      }

      document.getElementById('modal-heading').innerText = "🏁 VICTORY LAP!";
      document.getElementById('modal-subheading').innerHTML = `
        Completed 3 Laps in <strong>${formatTime(raceElapsedTime)}</strong>!<br>
        Coins Collected: <strong>${coinsCount}</strong> 🪙<br>
        ${isNewBest ? '<span style="color:#00f5a0; font-weight:bold;">🔥 NEW ALL-TIME RECORD! 🔥</span>' : 'Record: ' + formatTime(bestTime)}
      `;
      document.getElementById('game-modal').style.display = 'flex';
    }

    function resetBestTime() {
      localStorage.removeItem('auto_rally_best_time');
      bestTime = null;
      updateBestDisplay();
      alert('Best lap record reset.');
    }

    // Canvas Renderer
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sky & Horizon
      const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.4);
      skyGradient.addColorStop(0, '#0f172a');
      skyGradient.addColorStop(1, '#1e293b');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height * 0.4);

      // Road Grass Verge
      ctx.fillStyle = '#064e3b';
      ctx.fillRect(0, canvas.height * 0.4, canvas.width, canvas.height * 0.6);

      // Perspective Road Polygon
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.moveTo(canvas.width * 0.35, canvas.height * 0.4);
      ctx.lineTo(canvas.width * 0.65, canvas.height * 0.4);
      ctx.lineTo(canvas.width - 40, canvas.height);
      ctx.lineTo(40, canvas.height);
      ctx.closePath();
      ctx.fill();

      // Road Curb Borders (Red & White dashes)
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 6;
      ctx.stroke();

      // Center Dashed Lane Lines
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 4;
      ctx.setLineDash([20, 25]);
      ctx.lineDashOffset = -(lapDistance * 3) % 45;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, canvas.height * 0.4);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Collectibles & Obstacles
      const playerDist = (currentLap - 1) * LAP_LENGTH + lapDistance;
      entities.forEach(e => {
        const screenY = canvas.height - 130 - (e.y - playerDist);
        if (screenY > canvas.height * 0.4 && screenY < canvas.height + 40) {
          const depth = (screenY - canvas.height * 0.4) / (canvas.height * 0.6);
          const size = Math.max(10, 24 * depth);

          if (e.type === 'coin') {
            ctx.fillStyle = '#f6d365';
            ctx.beginPath();
            ctx.arc(e.x, screenY, size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
          } else if (e.type === 'boost') {
            ctx.fillStyle = '#00f2fe';
            ctx.fillRect(e.x - size / 2, screenY - size / 2, size, size);
          } else if (e.type === 'obstacle') {
            // Pothole / Barricade
            ctx.fillStyle = '#ff5858';
            ctx.fillRect(e.x - size / 1.5, screenY - size / 3, size * 1.3, size / 1.8);
          }
        }
      });

      // Draw Auto-Rickshaw (Indian Green & Yellow 3-Wheeler)
      drawAutoRickshaw(autoX, canvas.height - 130, boostTime > 0);
    }

    function drawAutoRickshaw(x, y, isBoosting) {
      ctx.save();
      ctx.translate(x, y);

      // Nitro exhaust flame if boosting
      if (isBoosting) {
        ctx.fillStyle = '#00f2fe';
        ctx.beginPath();
        ctx.arc(0, 36, 12 + Math.random() * 6, 0, Math.PI * 2);
        ctx.fill();
      }

      // Wheels
      ctx.fillStyle = '#111827';
      ctx.fillRect(-22, 10, 8, 18);
      ctx.fillRect(14, 10, 8, 18);

      // Body Lower Green Chassis
      ctx.fillStyle = '#15803d';
      ctx.beginPath();
      ctx.roundRect(-20, -18, 40, 42, 6);
      ctx.fill();

      // Yellow Top Roof (Classic Indian Auto)
      ctx.fillStyle = '#eab308';
      ctx.beginPath();
      ctx.roundRect(-18, -32, 36, 32, 8);
      ctx.fill();

      // Windshield glass
      ctx.fillStyle = '#bae6fd';
      ctx.beginPath();
      ctx.roundRect(-14, -28, 28, 12, 4);
      ctx.fill();

      // Headlight
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(0, -32, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // Run animation
    requestAnimationFrame(loop);
  </script>
</body>
</html>
