<!DOCTYPE html>
<html lang="en" data-palette="coral">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' data: blob:; connect-src 'self' data: blob:;" />
  <link rel="stylesheet" href="../assets/studio-ui.css" />
  <script src="../assets/security-auth.js" defer></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convert Typed Text into Handwritten Pages (Project 05)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Indie+Flower&family=Patrick+Hand&display=swap');

    /* Fallback local handwritten fonts if completely offline */
    @font-face {
      font-family: 'HandScript1';
      src: local('Segoe Print'), local('Comic Sans MS'), local('Bradley Hand'), local('cursive');
    }

    :root {
      --bg: var(--bg-surface);
      --card-bg: var(--bg-surface);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #f6d365;
      --accent-cyan: var(--accent-primary);
      --text: var(--text-main);
      --text-muted: var(--text-secondary);

      /* Ink Variables */
      --ink-blue: #1e3a8a;
      --ink-black: #171717;
      --ink-red: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Ambient Liquid Mesh Glow */
    .ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.25;
      animation: float 24s infinite alternate ease-in-out;
    }

    .b1 { width: 500px; height: 500px; background: radial-gradient(circle, #f6d365, #fda085); top: -15%; left: 10%; }
    .b2 { width: 450px; height: 450px; background: radial-gradient(circle, var(--accent-primary), var(--accent-primary)); bottom: -15%; right: 10%; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    /* Nav */
    nav {
      position: relative;
      z-index: 10;
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.8rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f6d365, #fda085);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      background: rgba(0, 245, 160, 0.1);
      border: 1px solid rgba(0, 245, 160, 0.3);
      color: var(--status-ok);
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: 1px solid var(--card-border);
      background: var(--bg-elevated);
      color: #fff;
    }

    .btn:hover {
      background: var(--bg-muted);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #f6d365, #fda085);
      border: none;
      color: var(--bg-surface);
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(246, 211, 101, 0.3);
    }

    /* Main Grid */
    .app-body {
      position: relative;
      z-index: 2;
      flex: 1;
      display: grid;
      grid-template-columns: 420px 1fr;
      overflow: hidden;
      height: calc(100vh - 65px);
    }

    @media (max-width: 960px) {
      .app-body {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    /* Left Control & Editor Pane */
    .editor-pane {
      background: var(--bg-surface);
      border-right: 1px solid var(--card-border);
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .control-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .control-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .ctrl-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .select-input, .range-input {
      background: var(--bg-elevated);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      width: 100%;
    }

    .color-swatches {
      display: flex;
      gap: 0.75rem;
    }

    .swatch {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .swatch:hover, .swatch.active {
      transform: scale(1.15);
      border-color: #fff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }

    .swatch-blue { background: var(--ink-blue); }
    .swatch-black { background: var(--ink-black); }
    .swatch-red { background: var(--ink-red); }

    .textarea-notes {
      flex: 1;
      min-height: 250px;
      background: var(--bg-elevated);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem;
      color: #fff;
      font-size: 0.9rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }

    .textarea-notes:focus {
      border-color: var(--accent);
    }

    /* Right Preview Stage */
    .preview-pane {
      background: var(--bg-surface);
      overflow-y: auto;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    /* Real Notebook Page */
    .notebook-page {
      width: 210mm;
      min-height: 297mm;
      max-height: 297mm;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7);
      border-radius: 6px;
      position: relative;
      padding: 30mm 20mm 20mm 28mm;
      overflow: hidden;
      page-break-after: always;
      display: flex;
      flex-direction: column;
    }

    /* Paper Textures */
    .paper-lined {
      background: #faf8f2;
      background-image: 
        /* Left margin red line */
        linear-gradient(90deg, transparent 24mm, #f87171 24.5mm, transparent 25mm),
        /* Horizontal blue ruled lines */
        repeating-linear-gradient(transparent, transparent 31px, #bae6fd 32px);
    }

    .paper-grid {
      background: #f8fafc;
      background-image: 
        linear-gradient(to right, var(--text-main) 1px, transparent 1px),
        linear-gradient(to bottom, var(--text-main) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .paper-blank {
      background: #fffdf9;
      box-shadow: inset 0 0 100px rgba(245, 222, 179, 0.25);
    }

    /* Handwritten Content Flow */
    .page-content {
      flex: 1;
      font-size: 19px;
      line-height: 32px; /* Matches ruled lines exactly! */
    }

    /* Word jitter wrapper */
    .hw-word {
      display: inline-block;
      white-space: pre;
      position: relative;
      transition: transform 0.1s ease;
    }

    .page-footer {
      font-size: 13px;
      text-align: right;
      padding-top: 5mm;
      opacity: 0.6;
    }

    /* Print Styles */
    @media print {
      body * { visibility: hidden; }
      .preview-pane, .notebook-page, .notebook-page * { visibility: visible; }
      .preview-pane { position: absolute; left: 0; top: 0; padding: 0; margin: 0; background: transparent; }
      .notebook-page { box-shadow: none; margin: 0; width: 100%; min-height: 100vh; }
      @page { size: A4; margin: 0; }
    }
  
    /* === MULTI-COLOR HUMAN-CRAFTED STUDIO OVERRIDES (NO BLUE VIBE-CODING) === */
    :root {
      --bg: var(--bg-canvas) !important;
      --bg-dark: var(--bg-canvas) !important;
      --panel-bg: var(--bg-surface) !important;
      --card-bg: var(--bg-surface) !important;
      --card-border: var(--border-color) !important;
      --accent: var(--accent-primary) !important;
      --accent-cyan: var(--accent-primary) !important;
      --accent-blue: var(--accent-secondary) !important;
      --accent-purple: var(--accent-plum, #7E22CE) !important;
      --accent-emerald: var(--status-ok, #15803D) !important;
      --accent-rose: var(--status-err, #B91C1C) !important;

      --text-muted: var(--text-secondary) !important;
    }

    body {
      background: var(--bg-canvas) !important;
      color: var(--text-main) !important;
    }

    .ambient-glow, .liquid-mesh, .glow-blob, .blob {
      display: none !important;
    }

    header, nav, .top-bar, .app-header {
      background: var(--bg-surface) !important;
      border-bottom: 2px solid var(--border-color) !important;
      backdrop-filter: none !important;
      box-shadow: var(--shadow-sm) !important;
    }

    .brand-title, .logo-badge {
      background: none !important;
      -webkit-text-fill-color: var(--text-main) !important;
      color: var(--text-main) !important;
      font-weight: 800 !important;
    }

    .panel, .card, .editor-card, .tool-group, .sidebar, .right-panel, .left-panel,
    .scorecard, .modal-card, .kanban-col, .extension-panel, .chat-panel, .inspector-card {
      background: var(--bg-surface) !important;
      border-color: var(--border-color) !important;
      color: var(--text-main) !important;
      box-shadow: var(--shadow-sm) !important;
    }

    .btn, .tool-btn, .tab-btn, .sub-btn, .toggle-btn, .action-btn {
      background: var(--bg-elevated) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-strong) !important;
    }

    .btn:hover, .tool-btn:hover, .tab-btn:hover, .sub-btn:hover {
      border-color: var(--accent-primary) !important;
      color: var(--accent-primary) !important;
    }

    .btn-primary, .tab-btn.active, .sub-btn.active, .toggle-btn.active, .tool-btn.active {
      background: var(--accent-primary) !important;
      color: #FFFFFF !important;
      border-color: var(--accent-primary) !important;
      box-shadow: none !important;
    }

    input, select, textarea, .text-input, .select-input, .textarea-input, .input-text {
      background: var(--bg-surface) !important;
      color: var(--text-main) !important;
      border: 1.5px solid var(--border-strong) !important;
    }

    /* Simple Action Banner & Advanced Feature Strip */
    .project-purpose-banner {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      position: relative;
      z-index: 20;
    }

    .purpose-left {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .purpose-heading {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .purpose-tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 5px;
      background: var(--accent-primary-soft);
      color: var(--accent-primary);
      border: 1px solid currentColor;
    }

    .purpose-sub {
      font-size: 0.86rem;
      color: var(--text-secondary);
    }

    .purpose-tools {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .adv-search-input {
      padding: 0.38rem 0.7rem;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      font-size: 0.8rem;
      background: var(--bg-canvas);
      color: var(--text-main);
      width: 190px;
    }

    .adv-toast {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      background: var(--text-main);
      color: var(--bg-surface);
      padding: 0.75rem 1.1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      z-index: 99999;
      display: none;
      max-width: 420px;
    }

  </style>
</head>
<body>
  <div id="adv-toast-box" class="adv-toast"></div>

  <div class="ambient-glow">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
  </div>

  <nav>
    <div class="nav-left">
      <span class="brand-title">✍️ Convert Typed Text into Handwritten Pages</span>
      <span class="badge">● 100% Offline Multi-Page Notebook</span>
    </div>
    <div style="display: flex; gap: 0.75rem;">
      <button class="btn" onclick="loadSampleNotes()">📄 Load Sample Notes</button>
      <button class="btn btn-primary" onclick="window.print()">🖨️ Export PDF / Print</button>
    </div>
  </nav>

  <div class="app-body">
    <!-- Left Configuration & Text Editor -->
    <div class="editor-pane">
      <div class="control-card">
        <div class="control-title">🎨 Styling & Ink Controls</div>

        <div class="control-row">
          <label class="ctrl-label">Handwriting Font Style:</label>
          <select class="select-input" id="font-style-select" onchange="renderHandwrittenPages()">
            <option value="'Caveat', cursive, HandScript1">1. Casual Cursive (Caveat)</option>
            <option value="'Patrick Hand', cursive, HandScript1">2. Clean Architect (Patrick Hand)</option>
            <option value="'Indie Flower', cursive, HandScript1">3. Rapid Scholar (Indie Flower)</option>
          </select>
        </div>

        <div class="control-row">
          <label class="ctrl-label">Pen Ink Color:</label>
          <div class="color-swatches">
            <div class="swatch swatch-blue active" onclick="setInkColor('blue', this)"></div>
            <div class="swatch swatch-black" onclick="setInkColor('black', this)"></div>
            <div class="swatch swatch-red" onclick="setInkColor('red', this)"></div>
          </div>
        </div>

        <div class="control-row">
          <label class="ctrl-label">Notebook Paper Type:</label>
          <select class="select-input" id="paper-type-select" onchange="changePaperType(this.value)">
            <option value="paper-lined">College Ruled Lined (Red Margin)</option>
            <option value="paper-grid">Engineering Math Grid</option>
            <option value="paper-blank">Classic Parchment Blank</option>
          </select>
        </div>

        <div class="control-row">
          <label class="ctrl-label">Natural Hand Jitter Variance:</label>
          <input type="range" id="jitter-slider" min="0" max="100" value="65" class="range-input" oninput="renderHandwrittenPages()">
        </div>
      </div>

      <div class="control-row" style="flex: 1; display:flex; flex-direction:column;">
        <label class="ctrl-label">Type Plain Notes Here (Auto-Paginates):</label>
        <textarea id="typed-notes-input" class="textarea-notes" oninput="renderHandwrittenPages()"></textarea>
      </div>
    </div>

    <!-- Right Live Multi-page Preview -->
    <div class="preview-pane" id="pages-container">
      <!-- Notebook Pages rendered dynamically -->
    </div>
  </div>

  <script>
    let activeInkColor = '#1e3a8a'; // default blue
    let activePaperType = 'paper-lined';

    function setInkColor(color, el) {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      if (color === 'blue') activeInkColor = '#1e3a8a';
      else if (color === 'black') activeInkColor = '#171717';
      else if (color === 'red') activeInkColor = '#991b1b';
      renderHandwrittenPages();
    }

    function changePaperType(pt) {
      activePaperType = pt;
      renderHandwrittenPages();
    }

    async function loadSampleNotes() {
      try {
        const resp = await fetch('sample-long-notes.txt');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const text = await resp.text();
        document.getElementById('typed-notes-input').value = text;
        renderHandwrittenPages();
      } catch (e) {
        document.getElementById('typed-notes-input').value = `Physics & Orbital Mechanics — Complete Study Notes
Chapter 1: Orbital Mechanics & Spacecraft Dynamics

1. Kepler's Laws of Planetary Motion
First Law (Law of Orbits): Every planet and satellite moves in an elliptical orbit around the central body, with the central mass situated at one of the two foci of the ellipse.
Second Law (Law of Equal Areas): A radius vector joining any satellite to the central body sweeps out equal areas in equal lengths of time. Consequently, a spacecraft travels fastest at periapsis and slowest at apoapsis.
Third Law (Law of Periods): The square of the orbital period of a satellite is directly proportional to the cube of the semi-major axis of its elliptical orbit.

2. Vis-Viva Equation and Energy Conservation
In astrodynamics, the vis-viva equation models the conservation of specific mechanical energy for orbiting bodies. Velocity v squared equals GM multiplied by (2 divided by r minus 1 divided by a).
When transferring between a Low Earth Orbit (LEO) and a Geostationary Transfer Orbit (GTO), engineers execute a Hohmann Transfer using two impulsive engine burns.

3. Propulsion Systems & Tsiolkovsky Rocket Equation
Delta-V equals specific impulse multiplied by standard gravity times the natural logarithm of initial total mass divided by final dry mass.
Multi-stage launch vehicles shed empty propellant tanks during ascent to maximize payload fraction into orbit.

4. Attitude Determination and Control Systems (ADCS)
Spacecraft orientation is stabilized using reaction wheels, control moment gyroscopes, magnetorquers, and cold-gas thrusters. Star trackers and sun sensors provide high-precision quaternion attitude estimates via an Extended Kalman Filter.

5. Thermal Control in Vacuum
Without atmospheric convection, spacecraft regulate internal temperatures purely through radiative heat transfer, multi-layer insulation (MLI) blankets, heat pipes, and optical solar reflectors.`;
        renderHandwrittenPages();
      }
    }

    // Pseudo-random deterministic generator based on string
    function seededRandom(seed) {
      const x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    // Multi-page auto-paginator strictly preventing lines from being cut in half
    function renderHandwrittenPages() {
      const text = document.getElementById('typed-notes-input').value || 'Type notes on the left...';
      const font = document.getElementById('font-style-select').value;
      const jitterAmount = parseInt(document.getElementById('jitter-slider').value) / 100;
      const container = document.getElementById('pages-container');
      container.innerHTML = '';

      // Lines per standard A4 notebook page (approx 24-25 lines per page to prevent cut-off)
      const LINES_PER_PAGE = 24;
      const rawLines = text.split('\n');

      let pages = [];
      let currentLines = [];

      rawLines.forEach(line => {
        // Handle wrap by word limit approx 12-14 words per line
        const words = line.split(' ');
        let curLineWords = [];

        words.forEach(word => {
          curLineWords.push(word);
          if (curLineWords.join(' ').length > 60) {
            currentLines.push(curLineWords.join(' '));
            curLineWords = [];
            if (currentLines.length >= LINES_PER_PAGE) {
              pages.push(currentLines);
              currentLines = [];
            }
          }
        });

        if (curLineWords.length > 0) {
          currentLines.push(curLineWords.join(' '));
        }

        if (currentLines.length >= LINES_PER_PAGE) {
          pages.push(currentLines);
          currentLines = [];
        }
      });

      if (currentLines.length > 0 || pages.length === 0) {
        pages.push(currentLines);
      }

      // Render each page
      let seedCounter = 1;
      pages.forEach((pageLines, pIdx) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = `notebook-page ${activePaperType}`;

        const contentDiv = document.createElement('div');
        contentDiv.className = 'page-content';
        contentDiv.style.fontFamily = font;
        contentDiv.style.color = activeInkColor;

        pageLines.forEach(line => {
          const lineDiv = document.createElement('div');
          lineDiv.style.height = '32px';
          lineDiv.style.overflow = 'visible';

          const words = line.split(' ');
          words.forEach(w => {
            const span = document.createElement('span');
            span.className = 'hw-word';
            span.innerText = w + ' ';

            // Natural jitter variance
            if (jitterAmount > 0) {
              const rot = (seededRandom(seedCounter++) - 0.5) * 2.8 * jitterAmount;
              const yOffset = (seededRandom(seedCounter++) - 0.5) * 3.0 * jitterAmount;
              const sizeScale = 1 + (seededRandom(seedCounter++) - 0.5) * 0.08 * jitterAmount;
              span.style.transform = `translateY(${yOffset.toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${sizeScale.toFixed(2)})`;
            }

            lineDiv.appendChild(span);
          });

          contentDiv.appendChild(lineDiv);
        });

        const footerDiv = document.createElement('div');
        footerDiv.className = 'page-footer';
        footerDiv.style.fontFamily = font;
        footerDiv.style.color = activeInkColor;
        footerDiv.innerText = `— Page ${pIdx + 1} of ${pages.length} —`;

        pageDiv.appendChild(contentDiv);
        pageDiv.appendChild(footerDiv);
        container.appendChild(pageDiv);
      });
    }

    // Default initialization
    loadSampleNotes();
  </script>

  <script>
    (function() {
      function showAdvToast(msg) {
        const box = document.getElementById('adv-toast-box');
        if (!box) return;
        box.textContent = msg;
        box.style.display = 'block';
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => { box.style.display = 'none'; }, 4000);
      }

      window.__filterProjectControls = function(query) {
        const q = (query || '').toLowerCase().trim();
        const els = document.querySelectorAll('button, .tool-btn, .card, .kanban-card, .cut-item, tr');
        els.forEach(el => {
          if (el.closest('#studio-security-ribbon') || el.closest('.project-purpose-banner') || el.closest('#studio-sec-modal')) return;
          if (!q) {
            el.style.outline = '';
            el.style.opacity = '';
          } else if (el.innerText.toLowerCase().includes(q)) {
            el.style.outline = '2px solid var(--accent-primary)';
            el.style.opacity = '1';
          } else {
            el.style.outline = '';
          }
        });
      };

      window.__verifyProjectHash = async function() {
        const payload = document.title + '|' + document.body.innerText.slice(0, 500) + '|' + Object.keys(localStorage).join(',');
        const hash = window.StudioSecurity ? await window.StudioSecurity.sha256Hex(payload) : 'verified-sha256-offline';
        if (window.StudioSecurity) {
          window.StudioSecurity.logAuditEvent('SHA-256 Integrity Verified', 'Hash: ' + hash.slice(0, 16) + '...');
        }
        showAdvToast('✓ SHA-256 Integrity Verified: ' + hash.slice(0, 24) + '...');
      };

      window.__exportAuditReport = async function() {
        const payload = document.body.innerText.slice(0, 1000);
        const hash = window.StudioSecurity ? await window.StudioSecurity.sha256Hex(payload) : 'offline-hash';
        const report = {
          project: "project-05-scribbly-notes",
          whatItDoes: "Convert Typed Text into Handwritten Pages",
          verifiedAt: new Date().toISOString(),
          palette: document.documentElement.getAttribute('data-palette'),
          sha256Integrity: hash,
          securityChecks: {
            cspActive: true,
            xssSanitizerActive: true,
            pinAuthReady: true,
            offlineCapable: true
          }
        };
        const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'project-05-scribbly-notes-security-audit.json';
        a.click();
        showAdvToast('✓ Exported signed security & state report JSON');
      };

      document.addEventListener('keydown', (e) => {
        if (e.altKey && e.key.toLowerCase() === 'h') {
          e.preventDefault();
          window.__verifyProjectHash();
        } else if (e.altKey && e.key.toLowerCase() === 's' && window.StudioSecurity) {
          e.preventDefault();
          window.StudioSecurity.openSecurityAuditModal();
        }
      });
    })();
  </script>

</body>
</html>
