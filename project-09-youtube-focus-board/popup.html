<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Focus Board</title>
  <style>
    :root {
      --bg: #070913;
      --card-bg: rgba(22, 27, 46, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #00f2fe;
      --text: #f0f4fc;
      --text-muted: #8e9bb5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.6rem;
    }
    .title {
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00f2fe, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .intent-box {
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid rgba(0, 242, 254, 0.25);
      border-radius: 10px;
      padding: 0.75rem;
      font-size: 0.82rem;
    }
    .intent-text { font-weight: 700; color: #fff; margin-top: 0.2rem; }
    .timer-tag { font-size: 0.75rem; color: #00f5a0; margin-top: 0.3rem; }
    .notes-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .note-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .ts-pill {
      background: rgba(0, 242, 254, 0.15);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">🎯 Focus Board</span>
    <span style="font-size: 0.75rem; color: #00f5a0;">● Active</span>
  </div>

  <div class="intent-box">
    <span style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase;">Current Study Intent:</span>
    <div class="intent-text" id="popup-intent">Revising Thermodynamics</div>
    <div class="timer-tag" id="popup-timer">Unlocked: 48 mins remaining</div>
  </div>

  <div class="notes-section">
    <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">Timestamped Study Notes:</div>
    <div class="note-item">
      <span>Carnot cycle efficiency curve</span>
      <span class="ts-pill">12:40</span>
    </div>
    <div class="note-item">
      <span>Entropy formula & derivation</span>
      <span class="ts-pill">24:15</span>
    </div>
  </div>
</body>
</html>
