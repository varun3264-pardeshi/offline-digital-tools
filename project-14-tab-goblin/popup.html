<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tab Goblin</title>
  <style>
    :root {
      --bg: #FAF7F2;
      --card-bg: rgba(22, 27, 46, 0.9);
      --card-border: rgba(255, 255, 255, 0.1);
      --goblin-green: #00f5a0;
      --text: #18181B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { width: 330px; background: var(--bg); color: var(--text); padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .goblin-hero { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--card-border); padding-bottom: 0.6rem; }
    .goblin-mood { font-size: 2.2rem; }
    .stats-text { font-size: 1.1rem; font-weight: 800; color: #00f5a0; }
    .subtext { font-size: 0.75rem; color: #94a3b8; }
    .btn { padding: 0.6rem; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
    .btn-feed { background: linear-gradient(135deg, #00f5a0, #00b4db); color: #FAF7F2; font-weight: 800; }
  </style>
</head>
<body>
  <div class="goblin-hero">
    <div>
      <div class="stats-text" id="p-tab-count">47 Tabs Open</div>
      <div class="subtext" id="p-goblin-status">31 asleep · goblin is full</div>
    </div>
    <div class="goblin-mood" id="p-goblin-avatar">👺</div>
  </div>

  <button class="btn btn-feed" onclick="feedGoblin()">🥩 Feed the Goblin (Discard Idle Tabs)</button>
  <button class="btn" style="background: rgba(255,255,255,0.06); color:#18181B;" onclick="window.open('index.html')">Open Tab Goblin Dashboard →</button>

  <script>
    function feedGoblin() {
      alert('Goblin ate 24 idle tabs! RAM memory freed via Chrome Tab Discard.');
    }
  </script>
</body>
</html>
